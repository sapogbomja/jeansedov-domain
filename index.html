eradas y emociones reales. Durante la sesión pueden relajarse y ser ustedes mismos: les ayudo con las poses cuando lo necesitan y observo lo que sucede entre ellas.", "aboutBody3": "Fuera del trabajo me gusta viajar con mis dos jack russells. Los lugares y las personas me inspiran a buscar sencillez, estética y un toque de atrevimiento en cada historia. Ahora me preparo para una nueva etapa de trabajo en México."});Object.assign(T.en,{"hero": "Real moments. Your day.", "heroSub": "Wedding photographs that feel like you.", "aboutTitle": "Hello, I’m Jean.", "aboutBody": "For over seven years I have photographed weddings, families, portraits and events. I want to create beautiful images and preserve the atmosphere and feelings you will want to return to.", "aboutBody2": "I love photographs full of life: laughter, embraces, unexpected glances and genuine emotion. You can relax and be yourselves; I will guide you when you need it and notice what happens in between.", "aboutBody3": "Away from work, I love travelling with my two Jack Russell terriers. New places and people inspire me to find simplicity, beauty and a little boldness in every story. I am now preparing for a new chapter of work in Mexico."});Object.assign(T.pt,{"hero": "Momentos reais. Seu dia.", "heroSub": "Casamentos para viver sendo vocês mesmos.", "aboutTitle": "Olá, sou Jean.", "aboutBody": "Há mais de sete anos fotografo casamentos, famílias, retratos e eventos. Quero criar imagens bonitas e preservar a atmosfera e os sentimentos aos quais vocês vão querer voltar.", "aboutBody2": "Adoro fotografias cheias de vida: risadas, abraços, olhares inesperados e emoções reais. Durante a sessão, vocês podem relaxar e ser quem são: ajudo com as poses quando necessário e observo o que acontece entre elas.", "aboutBody3": "Fora do trabalho, adoro viajar com meus dois jack russells. Novos lugares e pessoas me inspiram a buscar simplicidade, beleza e um toque de ousadia em cada história. Agora me preparo para uma nova etapa de trabalho no México."});Object.assign(T.ru,{"aboutBody": "Я фотографирую уже 11 лет. За это время я снимал свадьбы, портреты, семьи и события, но больше всего меня вдохновляют люди и настоящие истории между ними.", "aboutBody2": "Мне важно, чтобы вам было легко рядом со мной: без напряжения и страха перед камерой. Я помогу с позированием, подскажу, что делать, и в то же время оставлю вам пространство просто наслаждаться моментом.", "aboutBody3": "В моей работе встречаются современная эстетика, живые эмоции и внимание к деталям. Я слежу за визуальными трендами, но главными в кадре всегда остаетесь вы — ваш характер, ваше настроение и ваша история."});Object.assign(T.es,{"aboutBody": "Llevo 11 años fotografiando bodas, retratos, familias y eventos. Lo que más me inspira son las personas y las historias auténticas que nacen entre ellas.", "aboutBody2": "Quiero que se sientan a gusto conmigo y frente a la cámara. Les ayudo con las poses y les doy indicaciones cuando hace falta, dejando espacio para que disfruten el momento y sean ustedes mismos.", "aboutBody3": "Mi trabajo combina una estética contemporánea, emociones reales y atención a los detalles. Sigo las tendencias visuales, pero los protagonistas siempre son ustedes: su personalidad, su energía y su historia."});Object.assign(T.en,{"aboutBody": "I have been a photographer for 11 years, capturing weddings, portraits, families and events. What inspires me most is people and the real stories they share.", "aboutBody2": "I want you to feel at ease with me and in front of the camera. I will help with posing and offer direction when you need it, while giving you room to enjoy the moment and be yourselves.", "aboutBody3": "My work brings together a contemporary aesthetic, genuine emotion and attention to detail. I keep an eye on visual trends, but the focus is always on you: your personality, your energy and your story."});Object.assign(T.pt,{"aboutBody": "Fotografo há 11 anos, registrando casamentos, retratos,
